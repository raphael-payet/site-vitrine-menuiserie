<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" role="img" aria-label="L'artisan menuisier dans son atelier">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#261d12"/>
      <stop offset="0.55" stop-color="#2e2416"/>
      <stop offset="1" stop-color="#14100b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.6" cy="0.28" r="0.7">
      <stop offset="0" stop-color="#E9C88F" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#E9C88F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="1000"/><line x1="360" y1="0" x2="360" y2="1000"/>
    <line x1="560" y1="0" x2="560" y2="1000"/>
  </g>

  <!-- mur d'outils -->
  <g fill="none" stroke="#E4CBA3" stroke-opacity="0.7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- rabot -->
    <rect x="120" y="150" width="130" height="46" rx="6" fill="#3a2c1c" fill-opacity="0.4"/>
    <path d="M150 150 L150 128 L200 128 L200 150"/>
    <!-- équerre -->
    <path d="M320 130 L320 230 L300 230 L300 150 L400 150 L400 130 Z" fill="#3a2c1c" fill-opacity="0.35"/>
    <!-- scie -->
    <path d="M470 140 L610 140 L610 168 L470 176 Z" fill="#3a2c1c" fill-opacity="0.4"/>
    <path d="M610 154 q40 6 44 40 l-30 4 q-6 -24 -18 -30" fill="none"/>
  </g>
  <!-- ciseaux à bois suspendus -->
  <g stroke="#D3A873" stroke-opacity="0.8" stroke-width="3" stroke-linecap="round">
    <line x1="150" y1="240" x2="150" y2="300"/><line x1="185" y1="240" x2="185" y2="308"/>
    <line x1="220" y1="240" x2="220" y2="296"/>
  </g>

  <!-- établi -->
  <rect x="70" y="640" width="660" height="40" fill="#3a2c1c" fill-opacity="0.55" stroke="#E4CBA3" stroke-opacity="0.85" stroke-width="2.5"/>
  <g stroke="#E4CBA3" stroke-opacity="0.7" stroke-width="3">
    <line x1="130" y1="680" x2="130" y2="900"/><line x1="670" y1="680" x2="670" y2="900"/>
  </g>
  <!-- planches empilées sous l'établi -->
  <g stroke="#D3A873" stroke-opacity="0.5" stroke-width="2">
    <line x1="180" y1="760" x2="470" y2="760"/><line x1="180" y1="792" x2="470" y2="792"/>
    <line x1="180" y1="824" x2="470" y2="824"/>
  </g>

  <!-- l'artisan (silhouette élégante en train de raboter) -->
  <g fill="none" stroke="#E4CBA3" stroke-opacity="0.95" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="470" cy="392" r="40" fill="#3a2c1c" fill-opacity="0.5"/>
    <path d="M470 432 L470 470"/>
    <!-- torse penché -->
    <path d="M470 470 L432 592 L360 626"/>
    <path d="M470 470 L520 560 L560 610"/>
    <!-- bras vers le rabot -->
    <path d="M470 494 L410 606"/>
    <path d="M500 520 L556 612"/>
  </g>
  <!-- rabot poussé sur l'établi + copeaux -->
  <g stroke="#D3A873" stroke-opacity="0.9" stroke-width="3" stroke-linecap="round" fill="none">
    <rect x="360" y="612" width="90" height="26" rx="5" fill="#3a2c1c" fill-opacity="0.6"/>
    <path d="M360 620 q-26 -10 -50 -2 q22 6 40 14"/>
    <path d="M330 634 q-24 -6 -44 2"/>
  </g>
</svg>
