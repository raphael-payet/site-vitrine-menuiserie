<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Bibliothèque sur mesure toute hauteur">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241c12"/>
      <stop offset="0.55" stop-color="#2e2416"/>
      <stop offset="1" stop-color="#16120c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.16" r="0.9">
      <stop offset="0" stop-color="#C9954E" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#C9954E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>
  <!-- caisson -->
  <rect x="150" y="70" width="500" height="470" fill="#3a2c1c" fill-opacity="0.3" stroke="#E4CBA3" stroke-opacity="0.9" stroke-width="2.5"/>
  <!-- montants + étagères -->
  <g stroke="#E4CBA3" stroke-opacity="0.75" stroke-width="2">
    <line x1="317" y1="70" x2="317" y2="540"/>
    <line x1="483" y1="70" x2="483" y2="540"/>
    <line x1="150" y1="164" x2="650" y2="164"/>
    <line x1="150" y1="258" x2="650" y2="258"/>
    <line x1="150" y1="352" x2="650" y2="352"/>
    <line x1="150" y1="446" x2="650" y2="446"/>
  </g>
  <!-- livres (petits rectangles verticaux dorés/crème) -->
  <g stroke="none">
    <g fill="#D3A873" fill-opacity="0.8">
      <rect x="166" y="104" width="10" height="56"/><rect x="182" y="96" width="10" height="64"/>
      <rect x="210" y="110" width="10" height="50"/><rect x="226" y="100" width="10" height="60"/>
      <rect x="333" y="200" width="10" height="54"/><rect x="349" y="192" width="10" height="62"/>
      <rect x="365" y="204" width="10" height="50"/>
      <rect x="500" y="294" width="10" height="54"/><rect x="516" y="286" width="10" height="62"/>
      <rect x="532" y="298" width="10" height="50"/><rect x="548" y="290" width="10" height="58"/>
    </g>
    <g fill="#E4CBA3" fill-opacity="0.55">
      <rect x="198" y="102" width="10" height="58"/><rect x="242" y="108" width="10" height="52"/>
      <rect x="333" y="388" width="10" height="54"/><rect x="349" y="380" width="10" height="62"/>
      <rect x="500" y="484" width="10" height="52"/><rect x="516" y="476" width="10" height="60"/>
      <rect x="166" y="294" width="10" height="54"/><rect x="182" y="286" width="10" height="62"/>
    </g>
  </g>
  <!-- échelle -->
  <g stroke="#D3A873" stroke-opacity="0.7" stroke-width="2.5" stroke-linecap="round">
    <line x1="600" y1="90" x2="612" y2="530"/><line x1="636" y1="90" x2="648" y2="530"/>
    <line x1="606" y1="170" x2="642" y2="170"/><line x1="612" y1="270" x2="648" y2="270"/>
    <line x1="618" y1="370" x2="654" y2="370"/><line x1="624" y1="460" x2="660" y2="460"/>
  </g>
</svg>
