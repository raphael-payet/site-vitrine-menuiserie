<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Atelier de menuiserie">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d160d"/>
      <stop offset="0.5" stop-color="#241c11"/>
      <stop offset="1" stop-color="#100c07"/>
    </linearGradient>
    <radialGradient id="win" cx="0.72" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#E9C88F" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#E9C88F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9C88F" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#E9C88F" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#win)"/>

  <!-- grande verrière atelier -->
  <g>
    <rect x="1040" y="150" width="360" height="520" fill="#E9C88F" fill-opacity="0.1" stroke="#E4CBA3" stroke-opacity="0.6" stroke-width="4"/>
    <g stroke="#E4CBA3" stroke-opacity="0.4" stroke-width="2.5">
      <line x1="1160" y1="150" x2="1160" y2="670"/><line x1="1280" y1="150" x2="1280" y2="670"/>
      <line x1="1040" y1="323" x2="1400" y2="323"/><line x1="1040" y1="496" x2="1400" y2="496"/>
    </g>
  </g>
  <!-- faisceaux de lumière -->
  <path d="M1040 260 L520 760 L720 900 L1040 470 Z" fill="url(#beam)"/>
  <path d="M1040 470 L760 900 L940 940 L1080 560 Z" fill="url(#beam)"/>

  <!-- poussière de bois dans la lumière -->
  <g fill="#F1DDB6" fill-opacity="0.5">
    <circle cx="880" cy="560" r="2.5"/><circle cx="820" cy="640" r="2"/><circle cx="960" cy="600" r="2"/>
    <circle cx="760" cy="700" r="2.5"/><circle cx="900" cy="700" r="1.8"/><circle cx="1000" cy="520" r="2"/>
    <circle cx="700" cy="760" r="1.8"/><circle cx="840" cy="500" r="1.6"/>
  </g>

  <!-- établi -->
  <rect x="120" y="640" width="720" height="52" fill="#3a2c1c" fill-opacity="0.7" stroke="#E4CBA3" stroke-opacity="0.75" stroke-width="3"/>
  <g stroke="#E4CBA3" stroke-opacity="0.6" stroke-width="4">
    <line x1="210" y1="692" x2="210" y2="940"/><line x1="740" y1="692" x2="740" y2="940"/>
  </g>
  <!-- serre-joint -->
  <path d="M300 628 L300 720 L340 720 L340 700 L316 700 L316 628 Z" fill="#3a2c1c" fill-opacity="0.6" stroke="#D3A873" stroke-opacity="0.7" stroke-width="2.5"/>

  <!-- rabot + copeaux sur l'établi -->
  <g stroke="#D3A873" stroke-opacity="0.85" stroke-width="3" stroke-linecap="round" fill="none">
    <rect x="470" y="602" width="130" height="36" rx="7" fill="#3a2c1c" fill-opacity="0.7"/>
    <path d="M470 616 q-40 -14 -78 -2 q34 8 60 20"/>
    <path d="M420 636 q-36 -8 -70 4"/>
  </g>

  <!-- planches de bois adossées -->
  <g stroke="#E4CBA3" stroke-opacity="0.5" stroke-width="4" stroke-linecap="round">
    <line x1="160" y1="360" x2="240" y2="640"/><line x1="205" y1="352" x2="285" y2="632"/>
    <line x1="250" y1="346" x2="330" y2="626"/>
  </g>

  <!-- outils suspendus (silhouettes) -->
  <g fill="none" stroke="#E4CBA3" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- scie -->
    <path d="M470 150 L470 300 L500 300 L500 176 L640 176 L640 150 Z" fill="#3a2c1c" fill-opacity="0.4"/>
    <!-- équerre -->
    <path d="M700 150 L700 260 L724 260 L724 174 L820 174 L820 150 Z" fill="#3a2c1c" fill-opacity="0.4"/>
    <!-- maillet -->
    <path d="M300 150 L300 232 M270 150 L330 150 L330 210 L270 210 Z" fill="#3a2c1c" fill-opacity="0.4"/>
  </g>
</svg>
