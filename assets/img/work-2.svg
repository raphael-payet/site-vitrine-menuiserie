<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Escalier suspendu en noyer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241c12"/>
      <stop offset="0.55" stop-color="#2e2416"/>
      <stop offset="1" stop-color="#16120c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.2" r="0.85">
      <stop offset="0" stop-color="#C9954E" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#C9954E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="150" y1="0" x2="150" y2="600"/><line x1="330" y1="0" x2="330" y2="600"/>
    <line x1="510" y1="0" x2="510" y2="600"/><line x1="670" y1="0" x2="670" y2="600"/>
  </g>
  <line x1="60" y1="520" x2="740" y2="520" stroke="#E4CBA3" stroke-opacity="0.25" stroke-width="1.5"/>
  <!-- marches suspendues -->
  <g fill="#3a2c1c" fill-opacity="0.4" stroke="#E4CBA3" stroke-opacity="0.9" stroke-width="2" stroke-linejoin="round">
    <rect x="120" y="470" width="150" height="20"/>
    <rect x="190" y="410" width="150" height="20"/>
    <rect x="260" y="350" width="150" height="20"/>
    <rect x="330" y="290" width="150" height="20"/>
    <rect x="400" y="230" width="150" height="20"/>
    <rect x="470" y="170" width="150" height="20"/>
    <rect x="540" y="110" width="150" height="20"/>
  </g>
  <!-- limon mural -->
  <path d="M120 490 L610 130" fill="none" stroke="#D3A873" stroke-opacity="0.7" stroke-width="3" stroke-linecap="round"/>
  <!-- garde-corps : montants + main courante -->
  <g stroke="#D3A873" stroke-width="2" stroke-opacity="0.85" stroke-linecap="round">
    <line x1="150" y1="470" x2="180" y2="300"/>
    <line x1="220" y1="410" x2="250" y2="240"/>
    <line x1="290" y1="350" x2="320" y2="180"/>
    <line x1="360" y1="290" x2="390" y2="120"/>
    <line x1="430" y1="230" x2="460" y2="60"/>
    <line x1="500" y1="170" x2="530" y2="30"/>
  </g>
  <path d="M175 300 L525 30" fill="none" stroke="#E4CBA3" stroke-opacity="0.9" stroke-width="3" stroke-linecap="round"/>
</svg>
