<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <defs>
    <filter id="marb" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.013" numOctaves="5" seed="14" stitchTiles="stitch" result="noise"></feTurbulence>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.34  0 0 0 0 0.24  0 0 0 0 0.12  0 0 0 0.40 0"></feColorMatrix>
    </filter>
    <filter id="vein" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="turbulence" baseFrequency="0.004 0.009" numOctaves="3" seed="27" stitchTiles="stitch" result="v"></feTurbulence>
      <feColorMatrix in="v" type="matrix" values="0 0 0 0 0.26  0 0 0 0 0.17  0 0 0 0 0.08  0 0 0 0.22 0"></feColorMatrix>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" stitchTiles="stitch" result="g"></feTurbulence>
      <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.22  0 0 0 0 0.15  0 0 0 0 0.07  0 0 0 0.05 0"></feColorMatrix>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="#D2BB90"></rect>
  <rect width="1000" height="1000" filter="url(#marb)"></rect>
  <rect width="1000" height="1000" filter="url(#vein)"></rect>
  <rect width="1000" height="1000" filter="url(#grain)"></rect>
</svg>
