<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Dressing sur mesure en chêne clair">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241c12"/>
      <stop offset="0.55" stop-color="#2e2416"/>
      <stop offset="1" stop-color="#16120c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.18" r="0.9">
      <stop offset="0" stop-color="#C9954E" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#C9954E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>
  <line x1="60" y1="516" x2="740" y2="516" stroke="#E4CBA3" stroke-opacity="0.22" stroke-width="1.5"/>
  <!-- structure du dressing -->
  <rect x="120" y="90" width="560" height="426" fill="#3a2c1c" fill-opacity="0.3" stroke="#E4CBA3" stroke-opacity="0.9" stroke-width="2.5"/>
  <g stroke="#E4CBA3" stroke-opacity="0.7" stroke-width="2">
    <line x1="300" y1="90" x2="300" y2="516"/>
    <line x1="500" y1="90" x2="500" y2="516"/>
  </g>
  <!-- penderie gauche : barre + cintres/vêtements -->
  <line x1="140" y1="150" x2="280" y2="150" stroke="#D3A873" stroke-width="2.5" stroke-linecap="round"/>
  <g fill="#3a2c1c" fill-opacity="0.5" stroke="#E4CBA3" stroke-opacity="0.75" stroke-width="1.8" stroke-linejoin="round">
    <path d="M165 150 L150 330 L192 330 L177 150 Z"/>
    <path d="M205 150 L192 300 L232 300 L219 150 Z"/>
    <path d="M245 150 L233 340 L275 340 L263 150 Z"/>
  </g>
  <!-- module central : étagères + piles pliées -->
  <g stroke="#E4CBA3" stroke-opacity="0.7" stroke-width="1.8">
    <line x1="300" y1="180" x2="500" y2="180"/><line x1="300" y1="250" x2="500" y2="250"/>
    <line x1="300" y1="320" x2="500" y2="320"/><line x1="300" y1="390" x2="500" y2="390"/>
  </g>
  <g fill="#D3A873" fill-opacity="0.6">
    <rect x="322" y="200" width="70" height="42"/><rect x="410" y="205" width="70" height="37"/>
    <rect x="322" y="272" width="70" height="40"/><rect x="410" y="278" width="70" height="34"/>
  </g>
  <!-- tiroirs droite -->
  <g stroke="#E4CBA3" stroke-opacity="0.7" stroke-width="1.8">
    <line x1="500" y1="330" x2="680" y2="330"/><line x1="500" y1="400" x2="680" y2="400"/>
    <line x1="500" y1="460" x2="680" y2="460"/>
  </g>
  <g stroke="#D3A873" stroke-width="3" stroke-linecap="round">
    <line x1="575" y1="365" x2="605" y2="365"/><line x1="575" y1="430" x2="605" y2="430"/>
    <line x1="575" y1="488" x2="605" y2="488"/>
  </g>
  <!-- étagère à chaussures/haut droite -->
  <g stroke="#E4CBA3" stroke-opacity="0.6" stroke-width="1.8">
    <line x1="500" y1="180" x2="680" y2="180"/><line x1="500" y1="250" x2="680" y2="250"/>
  </g>
</svg>
